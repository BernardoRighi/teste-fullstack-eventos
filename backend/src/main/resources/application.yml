server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/teste}
    username: ${DB_USER:teste}
    password: ${DB_PASSWORD:teste}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  zone: ${BUSINESS_ZONE:America/Sao_Paulo}
